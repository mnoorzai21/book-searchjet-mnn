name: Update lockfiles

# Regenerates package-lock.json files when package.json changes on a
# branch, and commits the result to that branch. Can also be run manually.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "server/package.json"
      - "client/package.json"

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
        working-directory: server
      - run: npm install --package-lock-only --ignore-scripts
        working-directory: client
      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json client/package-lock.json
          git diff --cached --quiet || git commit -m "Update package-lock.json files"
          git push
